<rect x="80" y="1424" width="392" height="58" rx="6" fill="#ffffff" stroke="#d8dbe0" stroke-width="1"/>
<text x="94" y="1445" font-size="11" fill="#5b6470">Panel top = 11.81 rack + 1.4 panel = 13.21" above the bed rail.</text>
<text x="94" y="1463" font-size="11" fill="#5b6470">Measure the finished height of the truck before parking under anything.</text>
